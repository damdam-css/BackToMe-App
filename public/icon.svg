<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle / App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#primaryGrad)" />

  <!-- Inner Soft Pattern -->
  <circle cx="256" cy="256" r="180" fill="white" fill-opacity="0.08" />

  <!-- Shield / Badge Backing -->
  <g filter="url(#shadow)">
    <!-- Central Shield Base -->
    <path d="M256 100 L380 150 V260 C380 340 256 410 256 410 C256 410 132 340 132 260 V150 Z" fill="white" />
  </g>

  <!-- Inner Shield Accent -->
  <path d="M256 120 L360 162 V255 C360 324 256 384 256 384 C256 384 152 324 152 255 V162 Z" fill="#F8FAFC" />

  <!-- Magnifying Glass & Check / Lost & Found Icon -->
  <!-- Search Lens Circle -->
  <circle cx="236" cy="230" r="54" stroke="#1D4ED8" stroke-width="20" fill="none" />
  <!-- Search Handle -->
  <path d="M276 270 L320 314" stroke="#1D4ED8" stroke-width="20" stroke-linecap="round" />

  <!-- Checkmark / Return Badge in Amber/Gold -->
  <circle cx="286" cy="200" r="26" fill="url(#amberGrad)" />
  <path d="M275 200 L283 208 L299 192" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- School Tag Text '24' -->
  <text x="256" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#1E3A8A" text-anchor="middle" letter-spacing="2">SMKN 24</text>
</svg>
